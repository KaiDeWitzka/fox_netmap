x-netz-env: &netz-env
  # Vollstaendige Liste aller NETZ_*-Variablen aus app/settings_schema.py (D-2: kein dokumentierter Wert darf fehlen)
  NETZ_DATA_DIR: /data
  NETZ_HOST: ${NETZ_HOST:-0.0.0.0}
  NETZ_PORT: ${NETZ_PORT:-8399}
  NETZ_SQLITE_JOURNAL: ${NETZ_SQLITE_JOURNAL:-auto}  # wird in app/db.py per os.getenv gelesen (env-only)
  NETZ_ALARM_WHITELIST: ${{NETZ_ALARM_WHITELIST:-}}
  NETZ_AUTH_ENABLED: ${{NETZ_AUTH_ENABLED:-}}
  NETZ_AUTH_PASS: ${{NETZ_AUTH_PASS:-}}
  NETZ_AUTH_USER: ${{NETZ_AUTH_USER:-}}
  NETZ_AUTO_EXPORT: ${{NETZ_AUTO_EXPORT:-}}
  NETZ_AUTO_EXPORT_DIR: ${{NETZ_AUTO_EXPORT_DIR:-}}
  NETZ_AUTO_EXPORT_INTERVAL_HOURS: ${{NETZ_AUTO_EXPORT_INTERVAL_HOURS:-}}
  NETZ_COOKIE_SECURE: ${{NETZ_COOKIE_SECURE:-}}
  NETZ_DATA_DIR: ${{NETZ_DATA_DIR:-}}
  NETZ_DEVICE_RETENTION_DAYS: ${{NETZ_DEVICE_RETENTION_DAYS:-}}
  NETZ_EMBED_ANCESTORS: ${{NETZ_EMBED_ANCESTORS:-}}
  NETZ_EVENT_RETENTION_DAYS: ${{NETZ_EVENT_RETENTION_DAYS:-}}
  NETZ_FRITZ_MESH: ${{NETZ_FRITZ_MESH:-}}
  NETZ_FRITZ_PASS: ${{NETZ_FRITZ_PASS:-}}
  NETZ_FRITZ_URL: ${{NETZ_FRITZ_URL:-}}
  NETZ_FRITZ_URLS: ${{NETZ_FRITZ_URLS:-}}
  NETZ_FRITZ_USER: ${{NETZ_FRITZ_USER:-}}
  NETZ_HISTORY_HOURS: ${{NETZ_HISTORY_HOURS:-}}
  NETZ_HOST: ${{NETZ_HOST:-}}
  NETZ_LANG: ${{NETZ_LANG:-}}
  NETZ_MDNS_ENABLED: ${{NETZ_MDNS_ENABLED:-}}
  NETZ_NOTIFY_GOTIFY: ${{NETZ_NOTIFY_GOTIFY:-}}
  NETZ_NOTIFY_GOTIFY_TOKEN: ${{NETZ_NOTIFY_GOTIFY_TOKEN:-}}
  NETZ_NOTIFY_NTFY: ${{NETZ_NOTIFY_NTFY:-}}
  NETZ_NOTIFY_NTFY_TOKEN: ${{NETZ_NOTIFY_NTFY_TOKEN:-}}
  NETZ_NOTIFY_WEBHOOK: ${{NETZ_NOTIFY_WEBHOOK:-}}
  NETZ_OUI_ONLINE_ENABLED: ${{NETZ_OUI_ONLINE_ENABLED:-}}
  NETZ_OUI_ONLINE_MAX: ${{NETZ_OUI_ONLINE_MAX:-}}
  NETZ_OUI_ONLINE_URL: ${{NETZ_OUI_ONLINE_URL:-}}
  NETZ_PORT: ${{NETZ_PORT:-}}
  NETZ_PORT_TOP: ${{NETZ_PORT_TOP:-}}
  NETZ_PORTS: ${{NETZ_PORTS:-}}
  NETZ_SCAN_INTERVAL: ${{NETZ_SCAN_INTERVAL:-}}
  NETZ_SCAN_TIMEOUT: ${{NETZ_SCAN_TIMEOUT:-}}
  NETZ_SITES: ${{NETZ_SITES:-}}
  NETZ_SNMP_COMMUNITY: ${{NETZ_SNMP_COMMUNITY:-}}
  NETZ_SNMP_ENABLED: ${{NETZ_SNMP_ENABLED:-}}
  NETZ_SNMP_SWITCHES: ${{NETZ_SNMP_SWITCHES:-}}
  NETZ_SUBNET: ${{NETZ_SUBNET:-}}
  NETZ_SUBNETS: ${{NETZ_SUBNETS:-}}
  NETZ_THEME: ${{NETZ_THEME:-}}
  NETZ_TR064_INSECURE_TLS: ${{NETZ_TR064_INSECURE_TLS:-}}
  NETZ_VPN_POOL: ${{NETZ_VPN_POOL:-}}
  TZ: ${TZ:-Europe/Berlin}

services:
  netmap:
    build: .
    container_name: fox-netmap
    restart: unless-stopped
    ports:
      - "${NETMAP_PORT:-8399}:8399"
    environment: *netz-env
    volumes:
      - ./data:/data
    # Härtung (v1.5.0): Prozess läuft als UID 10001 ohne Capabilities (siehe docker/entrypoint.sh)
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  netmap-scanner:
    build: .
    container_name: fox-netmap-scanner
    restart: unless-stopped
    command: ["scanner"]
    network_mode: host
    # NET_RAW für ping (ICMP). NET_ADMIN wird seit v1.5.0 nicht mehr benötigt.
    cap_add:
      - NET_RAW
    environment: *netz-env
    volumes:
      - ./data:/data
    # Prozess läuft als UID 10001, Bounding-Set nur NET_RAW (siehe docker/entrypoint.sh).
    # Kein no-new-privileges: ping erhält NET_RAW über eine Datei-Capability.
    read_only: true
    tmpfs:
      - /tmp
