x-netz-env: &netz-env
  NETZ_DATA_DIR: /data
  NETZ_SUBNET: ${NETZ_SUBNET:-}
  NETZ_SUBNETS: ${NETZ_SUBNETS:-}
  NETZ_SCAN_INTERVAL: ${NETZ_SCAN_INTERVAL:-900}
  NETZ_SCAN_TIMEOUT: ${NETZ_SCAN_TIMEOUT:-1}
  NETZ_PORT_TOP: ${NETZ_PORT_TOP:-1000}
  NETZ_PORTS: ${NETZ_PORTS:-}
  NETZ_FRITZ_URL: ${NETZ_FRITZ_URL:-}
  NETZ_FRITZ_URLS: ${NETZ_FRITZ_URLS:-}
  NETZ_FRITZ_USER: ${NETZ_FRITZ_USER:-}
  NETZ_FRITZ_PASS: ${NETZ_FRITZ_PASS:-}
  NETZ_SNMP_ENABLED: ${NETZ_SNMP_ENABLED:-true}
  NETZ_SNMP_COMMUNITY: ${NETZ_SNMP_COMMUNITY:-public}
  NETZ_SNMP_SWITCHES: ${NETZ_SNMP_SWITCHES:-}
  NETZ_AUTH_ENABLED: ${NETZ_AUTH_ENABLED:-true}
  NETZ_AUTH_USER: ${NETZ_AUTH_USER:-admin}
  NETZ_AUTH_PASS: ${NETZ_AUTH_PASS:-}
  NETZ_NOTIFY_WEBHOOK: ${NETZ_NOTIFY_WEBHOOK:-}
  NETZ_NOTIFY_GOTIFY: ${NETZ_NOTIFY_GOTIFY:-}
  NETZ_NOTIFY_GOTIFY_TOKEN: ${NETZ_NOTIFY_GOTIFY_TOKEN:-}
  NETZ_NOTIFY_NTFY: ${NETZ_NOTIFY_NTFY:-}
  NETZ_NOTIFY_NTFY_TOKEN: ${NETZ_NOTIFY_NTFY_TOKEN:-}
  NETZ_HISTORY_HOURS: ${NETZ_HISTORY_HOURS:-720}
  NETZ_DEVICE_RETENTION_DAYS: ${NETZ_DEVICE_RETENTION_DAYS:-30}
  NETZ_THEME: ${NETZ_THEME:-dark}
  NETZ_AUTO_EXPORT: ${NETZ_AUTO_EXPORT:-false}
  NETZ_EMBED_ANCESTORS: ${NETZ_EMBED_ANCESTORS:-*}
  NETZ_COOKIE_SECURE: ${NETZ_COOKIE_SECURE:-auto}
  NETZ_OUI_ONLINE_ENABLED: ${NETZ_OUI_ONLINE_ENABLED:-false}
  TZ: ${TZ:-Europe/Berlin}

services:
  netmap:
    build: .
    container_name: fox-netmap
    restart: unless-stopped
    ports:
      - "${NETMAP_PORT:-8399}:8399"
    environment: *netz-env
    volumes:
      - ./data:/data
    # Härtung (v1.5.0): Prozess läuft als UID 10001 ohne Capabilities (siehe docker/entrypoint.sh)
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  netmap-scanner:
    build: .
    container_name: fox-netmap-scanner
    restart: unless-stopped
    command: ["scanner"]
    network_mode: host
    # NET_RAW für ping (ICMP). NET_ADMIN wird seit v1.5.0 nicht mehr benötigt.
    cap_add:
      - NET_RAW
    environment: *netz-env
    volumes:
      - ./data:/data
    # Prozess läuft als UID 10001, Bounding-Set nur NET_RAW (siehe docker/entrypoint.sh).
    # Kein no-new-privileges: ping erhält NET_RAW über eine Datei-Capability.
    read_only: true
    tmpfs:
      - /tmp
