<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fox_netmap</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Zum Inhalt springen</a>
<header>
  <h1>fox_netmap</h1>
  <nav id="nav" aria-label="Ansicht">
    <button data-view="map" class="active" aria-pressed="true">Karte</button>
    <button data-view="table" aria-pressed="false">Tabelle</button>
    <button data-view="log" aria-pressed="false">Log</button>
  </nav>
  <input id="search" type="search" aria-label="Suche (IP, Hostname, MAC, Hersteller, Notiz)" placeholder="Suche (IP, Hostname, MAC, Hersteller, Notiz)…">
  <select id="filter-category" aria-label="Kategorie filtern"><option value="">Alle Kategorien</option></select>
  <select id="filter-status" aria-label="Status filtern">
    <option value="">alle</option>
    <option value="online">online</option>
    <option value="offline">offline</option>
  </select>
  <select id="filter-site" aria-label="Standort filtern"><option value="">Alle Standorte</option></select>
  <button id="btn-online" aria-pressed="false" title="Nur online-Geräte anzeigen (Karte + Tabelle)">Nur online</button>
  <span id="scan-status" role="status" aria-live="polite" title="Scan-Status"></span>
  <span class="spacer"></span>
  <a class="hdr-btn" href="/api/export/json" download>JSON</a>
  <a class="hdr-btn" href="/api/export/csv?sep=semicolon" download>CSV</a>
  <label class="hdr-chk"><input type="checkbox" id="chk-groups" title="Geräte pro Subnetz als Gruppe zusammenfassen"> Subnetze gruppieren</label>
  <select id="layout-select" aria-label="Karten-Layout" title="Karten-Layout">
    <option value="auto" selected>Layout: auto</option>
    <option value="force">Force</option>
    <option value="tree">Hierarchisch</option>
    <option value="concentric">Kreise</option>
    <option value="circle">Kreis</option>
    <option value="grid">Raster</option>
  </select>
  <button id="btn-layout-reset" title="Gespeicherte Positionen löschen (Auto-Layout)">↺ Layout</button>
  <button id="btn-scan" title="Scan jetzt auslösen">Jetzt scannen</button>
  <button id="btn-print" title="Druckansicht (PDF)">Drucken</button>
  <button id="btn-theme" title="Theme wechseln">🌗</button>
  <button id="btn-settings" title="Einstellungen öffnen">⚙</button>
  <button id="btn-logout">Logout</button>
</header>
<main id="main" tabindex="-1">
  <section id="view-map" class="view" aria-label="Netzwerkkarte">
    <p class="visually-hidden">Interaktive Netzwerkkarte. Alle Geräte und Details sind in der Tabellenansicht auch per Tastatur erreichbar (Zeile fokussieren, dann Enter drücken).</p>
    <div id="map"></div>
  </section>
  <aside id="detail" hidden aria-label="Gerätedetails und Einstellungen">
      <div class="tabs" role="tablist" aria-label="Detail-Bereich">
        <button id="tab-detail" class="active" role="tab" aria-selected="true">Details</button>
        <button id="tab-settings" role="tab" aria-selected="false">Einstellungen</button>
        <button id="btn-close-detail" title="Schließen">✕</button>
      </div>
      <div id="detail-content" role="tabpanel" aria-labelledby="tab-detail"><p class="muted">Gerät anklicken für Details.</p></div>
      <div id="settings-content" role="tabpanel" aria-labelledby="tab-settings" hidden>
        <div class="panel">
          <h2>Einstellungen</h2>
          <form id="settings-form">
            <label>Theme
              <select id="st-theme"><option value="dark">dark</option><option value="light">light</option></select>
            </label>
            <label>Scan-Intervall (s) <input id="st-interval" type="number" min="30"></label>
            <label>Subnetze (kommagetrennt) <input id="st-subnets" type="text"></label>
            <label>Port-Umfang (Top N, 0 = alle) <input id="st-porttop" type="number" min="0"></label>
            <label>Historie (Stunden) <input id="st-history" type="number" min="1"></label>
            <label>Geräte offline löschen nach (Tagen, 0 = nie) <input id="st-retention" type="number" min="0"></label>
            <label><input id="st-snmp" type="checkbox"> SNMP-Scan aktiv</label>
            <label>SNMP-Switches (IPs, kommagetrennt) <input id="st-switches" type="text"></label>
            <label><input id="st-auth" type="checkbox"> Login aktiv</label>
            <label><input id="st-autoexport" type="checkbox"> automatische Exporte</label>
            <label>Auto-Export alle (Stunden, 0 = nach jedem Scan) <input id="st-autoexport-interval" type="number" min="0" max="720"></label>
            <label><input id="st-mdns" type="checkbox"> mDNS-Namensauflösung</label>
            <label>Whitelist (MAC/IP, kommagetrennt; kein Alarm) <input id="st-whitelist" type="text" placeholder="aa:bb:cc:dd:ee:ff, 192.168.178.50"></label>
            <label>Standorte (Name:Subnetz; Name2:Subnetz2) <input id="st-sites" type="text" placeholder="Zuhause:192.168.178.0/24; Remote:192.168.179.0/24"></label>
            <button type="submit">Speichern</button>
          </form>
          <p id="settings-msg" class="muted" role="alert"></p>
        </div>
        <div class="panel">
          <h2>Embed-Token</h2>
          <form id="token-form">
            <label>Ablauf (Stunden, leer = nie) <input id="tk-hours" type="number" min="1"></label>
            <label>Subnetze (leer = alle) <input id="tk-subnets" type="text"></label>
            <label>Kategorien (leer = alle) <input id="tk-categories" type="text"></label>
            <button type="submit">Token erstellen</button>
          </form>
          <p id="token-result" class="muted" role="status"></p>
          <ul id="token-list"></ul>
        </div>
      </div>
  </aside>
  <section id="view-table" class="view" hidden>
    <table id="device-table">
      <colgroup></colgroup>
      <thead></thead>
      <tbody></tbody>
    </table>
  </section>
  <section id="view-log" class="view" hidden>
    <div class="log-toolbar">
      <button id="btn-log-refresh">Aktualisieren</button>
      <label class="chk"><input type="checkbox" id="log-auto" checked> auto-refresh</label>
      <select id="log-level"><option value="">alle Level</option><option>INFO</option><option>WARNING</option><option>ERROR</option></select>
      <select id="log-lines"><option value="100">100</option><option value="300" selected>300</option><option value="1000">1000</option></select>
      <a class="hdr-btn" href="/api/logs/download" download>Log-Datei</a>
      <span id="log-status" class="muted" role="status"></span>
    </div>
    <pre id="log-view"></pre>
  </section>
</main>
<script src="/static/vendor/cytoscape.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
