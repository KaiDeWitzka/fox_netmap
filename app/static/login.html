<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fox_netmap – Login</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-page">
  <form id="login-form" class="panel">
    <h1><img class="hdr-logo" src="/static/favicon.svg" alt="" width="28" height="28">fox_netmap</h1>
    <label for="login-user" data-i18n="login.user">Benutzer</label>
    <input id="login-user" data-i18n-ph="login.user" placeholder="Benutzer" autocomplete="username" required>
    <label for="login-pass" data-i18n="login.pass">Passwort</label>
    <input id="login-pass" type="password" data-i18n-ph="login.pass" placeholder="Passwort" autocomplete="current-password" required>
    <button type="submit" data-i18n="login.btn">Login</button>
    <p id="login-err" class="muted" role="alert"></p>
  </form>
  <script src="/static/i18n.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
