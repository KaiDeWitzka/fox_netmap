[project]
name = "fox-netmap"
version = "1.6.13"
license = "MIT"
description = "Interaktive Netzwerkkarte des Heimnetzes: scannen, anzeigen, bearbeiten, einbetten, exportieren"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
