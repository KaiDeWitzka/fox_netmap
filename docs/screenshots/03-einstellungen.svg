ont-size="10">Theme</text><rect x="1160" y="756" width="100" height="20" rx="5" fill="#0f172a" stroke="#64748b"/><text x="960" y="796" fill="#94a3b8" font-size="10">Sprache</text><rect x="1160" y="782" width="100" height="20" rx="5" fill="#0f172a" stroke="#64748b"/><rect x="950" y="828" width="320" height="34" rx="6" fill="#075985" stroke="#38bdf8"/><text x="1110" y="850" fill="#fff" font-size="12" text-anchor="middle">Speichern</text>
