# Dependabot: wöchentliche Update-PRs für alle Abhängigkeitsquellen.
# cooldown: neue Versionen erst nach einigen Tagen vorschlagen (Schutz vor kurzlebigen,
# kompromittierten Releases wie beim Trivy-Vorfall im März 2026). Sicherheitsupdates sind ausgenommen.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, python]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps-dev)"
    labels: [dependencies, javascript]
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    ignore:
      # Python-Minor-Wechsel (3.13 …) bewusst manuell
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]
    commit-message:
      prefix: "chore(docker)"
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencies, ci]
