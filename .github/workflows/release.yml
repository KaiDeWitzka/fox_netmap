name: release

# Tag v*.*.*        → Tests, Multi-Arch-Image bauen, Trivy-Gate, nach GHCR pushen, GitHub-Release mit SBOM.
# Pull Request      → Probelauf (Multi-Arch-Build + Trivy-Gate, kein Push), wenn Build-relevante Dateien geändert wurden.
on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - Dockerfile
      - docker/**
      - requirements.txt
      - scripts/trivy.sh
      - .trivyignore
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kaidewitzka/fox_netmap
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren (hash-gepinnt)
        run: pip install --require-hashes --no-deps -r requirements-dev.txt && pip check
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: UI DOM-Test
        run: |
          npm ci --no-audit --no-fund
          node tests/ui_dom_check.mjs
      - name: Tag passt zur App-Version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c "import app; print(app.__version__)")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME ≠ app.__version__ $v"; exit 1; }

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tags und OCI-Labels bestimmen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=fox_netmap
            org.opencontainers.image.licenses=MIT
      - name: amd64-Image lokal bauen (für Scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fox-netmap:scan
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-to: type=gha,mode=max
      - name: Trivy-Gate (CRITICAL/HIGH mit verfügbarem Fix)
        run: |
          mkdir -p reports ~/.cache/trivy
          scripts/trivy.sh image --scanners vuln --ignore-unfixed --severity CRITICAL,HIGH \
            --ignorefile .trivyignore --exit-code 1 fox-netmap:scan
          scripts/trivy.sh image --scanners vuln --format table --output reports/trivy-report.txt fox-netmap:scan
          scripts/trivy.sh image --format cyclonedx --output reports/sbom.cdx.json fox-netmap:scan
          scripts/trivy.sh image --format spdx-json --output reports/sbom.spdx.json fox-netmap:scan
      - name: Bei GHCR anmelden
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-Arch-Image bauen und pushen (mit SBOM- und Provenance-Attestierung)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Berichte sichern
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-reports
          path: reports/
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-reports
          path: reports
      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cat > notes.md <<NOTES
          fox_netmap ${GITHUB_REF_NAME} – Änderungen siehe [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md).

          Container-Image (linux/amd64, linux/arm64):

              docker pull ${IMAGE}:${v}
              docker pull ${IMAGE}@${DIGEST}

          Anhänge: SBOM (CycloneDX, SPDX) und Trivy-Bericht des amd64-Images zum Release-Zeitpunkt.
          NOTES
          gh release create "$GITHUB_REF_NAME" --title "fox_netmap $GITHUB_REF_NAME" --notes-file notes.md \
            "reports/sbom.cdx.json#SBOM (CycloneDX)" \
            "reports/sbom.spdx.json#SBOM (SPDX)" \
            "reports/trivy-report.txt#Trivy-Bericht"
