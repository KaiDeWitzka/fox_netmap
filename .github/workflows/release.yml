name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: UI DOM-Test
        run: |
          npm install --no-audit --no-fund
          node tests/ui_dom_check.mjs
      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "fox_netmap $GITHUB_REF_NAME" --notes "fox_netmap $GITHUB_REF_NAME (SemVer major.minor.patch) — Version siehe app/__init__.py"
