name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Gate (ruff, format, mypy, pytest+cov, UI-DOM, eslint, pip-audit)
        run: bash scripts/gate.sh

  docker:
    # Baut das Image und prüft die Container-Härtung (v1.5.0) im laufenden Compose-Stack.
    runs-on: ubuntu-latest
    needs: test
    env:
      NETZ_AUTH_PASS: ci-secret
      NETZ_SUBNETS: 127.0.0.0/30
      NETZ_PORT_TOP: "10"
      NETZ_SCAN_INTERVAL: "60"
      COMPOSE_PROJECT_NAME: foxci
      IMAGE: foxci-netmap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image bauen
        run: docker compose build
      - name: Trivy-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-${{ github.run_id }}
          restore-keys: trivy-
      - name: Trivy – Schwachstellen im Image (Gate CRITICAL/HIGH mit Fix)
        run: |
          mkdir -p reports ~/.cache/trivy
          scripts/trivy.sh image --scanners vuln --ignore-unfixed --severity CRITICAL,HIGH \
            --ignorefile .trivyignore --exit-code 1 "$IMAGE"
      - name: Trivy – Konfiguration und Repository (Dockerfile, Compose, Lockfiles)
        run: |
          scripts/trivy.sh fs --scanners vuln,misconfig,secret --ignore-unfixed --severity CRITICAL,HIGH \
            --ignorefile .trivyignore --skip-dirs node_modules --exit-code 1 .
      - name: SBOM erzeugen (CycloneDX + SPDX)
        run: |
          scripts/trivy.sh image --format cyclonedx --output reports/sbom.cdx.json "$IMAGE"
          scripts/trivy.sh image --format spdx-json --output reports/sbom.spdx.json "$IMAGE"
          scripts/trivy.sh image --scanners vuln --format table --output reports/trivy-image.txt "$IMAGE"
      - name: SBOM und Scan-Bericht hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-und-scan
          path: reports/
          retention-days: 30
      - name: Upgrade simulieren (root-eigene Bestandsdaten wie bis v1.4.x)
        run: |
          mkdir -p data
          sudo sh -c 'echo alt > data/legacy.txt && chown 0:0 data data/legacy.txt'
      - name: Stack starten
        run: docker compose up -d
      - name: Auf healthy warten
        run: |
          for i in $(seq 1 45); do
            web=$(docker inspect -f '{{.State.Health.Status}}' fox-netmap)
            scan=$(docker inspect -f '{{.State.Health.Status}}' fox-netmap-scanner)
            echo "web=$web scanner=$scan"
            [ "$web" = healthy ] && [ "$scan" = healthy ] && exit 0
            sleep 2
          done
          exit 1
      - name: Prozesse laufen als UID 10001 mit minimalen Capabilities
        run: |
          set -eu
          for c in fox-netmap fox-netmap-scanner; do
            uid=$(docker exec "$c" awk '/^Uid:/{print $2}' /proc/1/status)
            eff=$(docker exec "$c" awk '/^CapEff:/{print $2}' /proc/1/status)
            bnd=$(docker exec "$c" awk '/^CapBnd:/{print $2}' /proc/1/status)
            echo "$c uid=$uid CapEff=$eff CapBnd=$bnd"
            test "$uid" = 10001
            test "$eff" = 0000000000000000
          done
          test "$(docker exec fox-netmap awk '/^CapBnd:/{print $2}' /proc/1/status)" = 0000000000000000
          test "$(docker exec fox-netmap awk '/^NoNewPrivs:/{print $2}' /proc/1/status)" = 1
          # Scanner: nur NET_RAW (Bit 13) im Bounding-Set
          test "$(docker exec fox-netmap-scanner awk '/^CapBnd:/{print $2}' /proc/1/status)" = 0000000000002000
      - name: ping funktioniert ohne root im Scanner-Kontext
        run: |
          docker exec fox-netmap-scanner setpriv --reuid=10001 --regid=10001 --clear-groups \
            --bounding-set=-all,+net_raw --inh-caps=-all ping -c 1 -W 2 127.0.0.1
      - name: Bestandsdaten übernommen, Root-Dateisystem schreibgeschützt
        run: |
          set -eu
          test "$(stat -c %u data/legacy.txt)" = 10001
          test "$(stat -c %u data/netmap.db)" = 10001
          ! docker exec -u 0 fox-netmap touch /usr/local/x 2>/dev/null
      - name: HTTP-Smoke-Test (Health, Header, Login)
        run: |
          set -eu
          curl -fsS http://localhost:8399/api/health
          curl -fsSI http://localhost:8399/login | grep -i "content-security-policy"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-secret"}' http://localhost:8399/api/login)
          test "$code" = 200
      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs --no-color
      - name: Aufräumen
        if: always()
        run: docker compose down -v
