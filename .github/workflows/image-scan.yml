name: image-scan

# Wöchentlicher Nachscan der veröffentlichten Images (:latest und :main): findet CVEs, die nach dem
# Release/Merge bekannt wurden. Bei Treffern schlägt der Lauf fehl (GitHub benachrichtigt) – Abhilfe:
# Dependabot-PR mergen bzw. Patch-Release.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/kaidewitzka/fox_netmap

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bei GHCR anmelden und Image holen
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -x
          # Fallback, falls die workflow-env IMAGE einmal nicht durchgereicht wird (2026-11-23: pull ohne Argumente)
          IMG="${IMAGE:-ghcr.io/kaidewitzka/fox_netmap}"
          docker pull "${IMG}:latest"
          docker pull "${IMG}:main"
      - name: Trivy-Scan (latest + main)
        run: |
          IMG="${IMAGE:-ghcr.io/kaidewitzka/fox_netmap}"
          mkdir -p reports ~/.cache/trivy
          for tag in latest main; do
            echo "== Scan $IMG:$tag"
            scripts/trivy.sh image --scanners vuln --format table --output "reports/trivy-$tag.txt" "${IMG}:${tag}"
            scripts/trivy.sh image --scanners vuln --ignore-unfixed --severity CRITICAL,HIGH \
              --ignorefile .trivyignore --exit-code 1 "${IMG}:${tag}"
          done
      - name: Bericht sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-latest
          path: reports/
          retention-days: 30
