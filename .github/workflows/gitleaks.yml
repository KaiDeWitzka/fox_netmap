name: gitleaks

# Secret-Scan der kompletten Git-History bei jedem Push/PR (gratis auf GitHub).
# Action per Commit-SHA gepinnt (v3.0.0). False Positives stehen in .gitleaksignore.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # volle History scannen
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        with:
          args: --redact --log-opts="--all"
