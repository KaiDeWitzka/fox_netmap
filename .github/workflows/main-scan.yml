name: main-scan

# Jeder Push auf main: gehärtetes Image bauen, Trivy-Gate (CRITICAL/HIGH mit Fix),
# SBOM erzeugen und das Image als :main / :sha-<sha> nach GHCR pushen.
# Berichte (Trivy + SBOM) landen als Artefakt (30 Tage).
# Releases (Tags v*.*.*) laufen weiterhin ueber release.yml (:latest + Versions-Tag + GitHub-Release).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kaidewitzka/fox_netmap
  PLATFORMS: linux/amd64, linux/arm64

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: amd64-Image lokal bauen (fuer Scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fox-netmap:scan
          build-args: VERSION=${{ github.sha }}
          cache-to: type=gha,mode=max
      - name: Trivy-Gate + Berichte + SBOM
        run: |
          mkdir -p reports ~/.cache/trivy
          scripts/trivy.sh image --scanners vuln --ignore-unfixed --severity CRITICAL,HIGH \
            --ignorefile .trivyignore --exit-code 1 fox-netmap:scan
          scripts/trivy.sh image --scanners vuln --format table --output reports/trivy-report.txt fox-netmap:scan
          scripts/trivy.sh image --format cyclonedx --output reports/sbom.cdx.json fox-netmap:scan
          scripts/trivy.sh image --format spdx-json --output reports/sbom.spdx.json fox-netmap:scan
      - name: Bei GHCR anmelden
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-Arch-Image bauen und als :main / :sha-<sha> pushen (mit SBOM- und Provenance-Attestierung)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=fox_netmap
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan-Berichte + SBOM als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-scan-${{ github.sha }}
          path: reports/
          retention-days: 30
