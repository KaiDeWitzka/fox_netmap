name: codeql

# Code-Scanning mit CodeQL (Python + JavaScript).
# Ergaenzt das GitHub-Default-Setup (Settings -> Advanced Security) um einen
# Workflow IM Repo: volle Kontrolle ueber Trigger, Sprachen und Action-SHAs.
# Ergebnisse landen als Alerts im Security-Tab des Repos.
# Alle Actions per SHA gepinnt (Tag im Kommentar), wie in den anderen Workflows.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # woechentlich Montag 06:17 UTC (07:17 MEZ)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # SARIF-Upload an Code Scanning

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
